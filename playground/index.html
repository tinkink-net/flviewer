<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flviewer playground</title>
  </head>
  <body>
    <main>
      <h1>flviewer playground</h1>
      <p>
        Pure client-side file preview: images, PDF, video &amp; audio, the text family (txt / code /
        JSON / CSV / XML / Markdown-as-HTML), and office documents (DOCX / XLSX / PPTX). Double as
        manual QA rig.
      </p>

      <h2>Custom file</h2>
      <p>
        <label>
          Pick a file (PDF, image, video, audio, text or office):
          <input
            type="file"
            id="custom-file"
            accept="application/pdf,image/*,video/*,audio/*,.md,.markdown,.csv,.tsv,.json,.xml,.txt,.log,.ts,.tsx,.js,.jsx,.py,.go,.rs,.java,.sh,.yml,.yaml,.toml,.html,.css,.docx,.xlsx,.xlsm,.pptx,.pptm"
          />
        </label>
        <button data-demo="custom-open" disabled>open in overlay</button>
        <button data-demo="custom-mount" disabled>mount below</button>
      </p>

      <h2>Overlay — <code>open()</code></h2>
      <button data-demo="open-png">open PNG</button>
      <button data-demo="open-jpg">open JPG</button>
      <button data-demo="open-pdf">open PDF (lazy pdf.js)</button>
      <button data-demo="open-docx">open DOCX (lazy docx-preview)</button>
      <button data-demo="open-xlsx">open XLSX (multi-sheet)</button>
      <button data-demo="open-pptx">open PPTX (lazy engine)</button>
      <button data-demo="open-mp4">open MP4</button>
      <button data-demo="open-webm">open WebM</button>
      <button data-demo="open-mp3">open MP3</button>
      <button data-demo="open-txt">open TXT</button>
      <button data-demo="open-code">open TS (code)</button>
      <button data-demo="open-json">open JSON</button>
      <button data-demo="open-csv">open CSV</button>
      <button data-demo="open-xml">open XML</button>
      <button data-demo="open-md">open Markdown (rendered)</button>
      <button data-demo="open-md-hook">open Markdown (asset hook)</button>
      <button data-demo="open-md-blob">open Markdown (blob — no base URL)</button>
      <button data-demo="open-url">open by URL</button>
      <button data-demo="open-remote">open remote image (picsum)</button>
      <button data-demo="open-broken">open unsupported</button>

      <h2>Embed — <code>mount()</code></h2>
      <div id="embed-1" style="height: 360px; border: 1px dashed #555; border-radius: 8px"></div>
      <div>
        <button data-demo="mount-pdf">mount PDF</button>
        <button data-demo="mount-docx">mount DOCX</button>
        <button data-demo="mount-xlsx">mount XLSX</button>
        <button data-demo="mount-pptx">mount PPTX</button>
        <button data-demo="mount-png">mount PNG</button>
        <button data-demo="mount-mp4">mount MP4</button>
        <button data-demo="mount-md">mount Markdown</button>
        <button data-demo="swap">controller.update()</button>
      </div>

      <h2>Web component — <code>&lt;fl-viewer&gt;</code></h2>
      <fl-viewer id="wc" style="display: block; width: 480px; height: 360px"></fl-viewer>
      <div>
        <button data-demo="wc-pdf">set source = PDF</button>
        <button data-demo="wc-png">set source = PNG</button>
        <button data-demo="wc-mp4">set source = MP4</button>
        <button data-demo="wc-md">set source = Markdown</button>
      </div>

      <script type="module" src="/main.ts"></script>
    </main>
  </body>
</html>
